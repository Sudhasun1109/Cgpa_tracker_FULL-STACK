<body class="auth-page">
  <div class="auth-card">
    <a class="brand" href="index.html">🎓 CGPA Tracker</a>
    <h1>Reset your password</h1>
    <p>Confirm your identity with your register number, then set a new password.</p>
    <form id="forgotForm">
      <label>Email<input id="email" type="email" required></label>
      <label>Register Number<input id="registerNumber" required></label>
      <label>New Password<input id="newPassword" type="password" minlength="6" required></label>
      <label>Confirm New Password<input id="confirmPassword" type="password" minlength="6" required></label>
      <label class="show-pass"><input type="checkbox" id="showForgotPass"> Show password</label>
      <button class="btn full" type="submit">Reset Password</button>
    </form>
    <div id="message" class="message"></div>
    <p class="center">Remembered it? <a href="login.html">Back to login</a></p>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
