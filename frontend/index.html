<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGPA Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing">
  <nav class="nav container">
    <a class="brand" href="index.html"> CGPA Tracker</a>
    <div>
      <a class="btn btn-outline" href="login.html">Login</a>
      <a class="btn" href="register.html">Register</a>
    </div>

  <main class="hero container">
    <div>
      <span class="badge">Student Academic Companion</span>
      <h1>Track your CGPA.<br><span>Plan your progress.</span></h1>
