<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your personal CGPA dashboard.">
  <meta name="author" content="CGPA Tracker">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://cgpa-tracker-frontend.onrender.com/dashboard.html">
  <link rel="icon" href="icons/icon-192.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CGPA Tracker">
  <meta property="og:title" content="Dashboard – CGPA Tracker">
  <meta property="og:description" content="Your personal CGPA dashboard.">
  <meta property="og:url" content="https://cgpa-tracker-frontend.onrender.com/dashboard.html">
  <meta property="og:image" content="https://cgpa-tracker-frontend.onrender.com/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dashboard – CGPA Tracker">
  <meta name="twitter:description" content="Your personal CGPA dashboard.">
  <meta name="twitter:image" content="https://cgpa-tracker-frontend.onrender.com/icons/og-image.png">
  <title>Dashboard – CGPA Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CGPA">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="dashboard.html">🎓 CGPA Tracker</a>
      <div class="nav-right">
        <img id="navAvatar" class="nav-avatar hidden" alt="Profile">
        <button id="editProfileBtn" class="btn btn-outline" data-no-ratelimit>Edit Profile</button>
        <button id="feedbackBtn" class="btn btn-outline" data-no-ratelimit>Feedback</button>
        <button id="logoutBtn" class="btn btn-outline">Logout</button>
      </div>
    </div>
  </header>
  <main class="container dashboard">
    <section class="welcome">
      <div>
        <span class="badge">Dashboard</span>
        <h1 id="welcome">Welcome!</h1>
        <p id="profileText"></p>
      </div>
      <button id="addSemesterBtn" class="btn" data-no-ratelimit>+ Add Semester</button>
    </section>

    <section class="stats">
      <div class="stat-card"><small>Current CGPA</small><strong id="cgpa">0.00</strong></div>
      <div class="stat-card"><small>Total Credits</small><strong id="credits">0</strong></div>
      <div class="stat-card"><small>Semesters</small><strong id="semesterCount">0</strong></div>
      <div class="stat-card"><small>Best GPA</small><strong id="bestGpa">0.00</strong></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>CGPA Progress</h2><span id="status"></span></div>
      <div id="chart" class="chart"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Your Semesters</h2></div>
      <div id="semesters" class="semester-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Mark Sheets</h2>
        <button id="addMarksheetBtn" class="btn" data-no-ratelimit>+ Add Mark Sheet</button>
      </div>
      <div id="marksheets" class="marksheet-grid"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="closeModal">×</button>
      <h2>Add Semester</h2>
      <form id="semesterForm">
        <label>Semester Number
          <input id="semesterNumber" type="number" min="1" max="12" required>
        </label>
        <label>Semester Name
          <input id="semesterName" placeholder="Semester 1" required>
        </label>
        <button class="btn full" type="submit">Create Semester</button>
      </form>
      <div id="modalMessage" class="message"></div>
    </div>
  </div>

  <div id="marksheetModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="closeMarksheetModal">×</button>
      <h2>Add Mark Sheet</h2>
      <form id="marksheetForm">
        <label>Title
          <input id="marksheetTitle" placeholder="Semester 2 Grade Sheet" required>
        </label>
        <label>Semester Number (optional)
          <input id="marksheetSemester" type="number" min="1" max="12" placeholder="2">
        </label>
        <label>Mark Sheet Image
          <input id="marksheetFile" type="file" accept="image/*" required>
        </label>
        <div id="marksheetPreview" class="ms-preview"></div>
        <button class="btn full" type="submit">Upload Mark Sheet</button>
      </form>
      <div id="marksheetMessage" class="message"></div>
    </div>
  </div>

  <div id="viewerModal" class="modal hidden">
    <div class="viewer-card">
      <button class="close" id="closeViewer">×</button>
      <img id="viewerImage" alt="Mark sheet">
    </div>
  </div>


  <!-- EDIT PROFILE MODAL -->
  <div id="profileModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="closeProfileModal">&times;</button>
      <h2>Edit Profile</h2>
      <form id="profileForm">
        <div class="avatar-edit">
          <img id="profilePreview" class="avatar-lg" alt="Profile photo">
          <div class="avatar-actions">
            <label class="file-btn">Choose Photo<input id="profilePhotoFile" type="file" accept="image/*" hidden></label>
            <button type="button" id="removePhotoBtn" class="small-btn danger" data-no-ratelimit>Remove Photo</button>
          </div>
        </div>
        <label>Name<input id="pfName" required></label>
        <label>Email<input id="pfEmail" type="email" required></label>
        <label>Register Number<input id="pfReg" readonly disabled></label>
        <label>College
          <input id="pfCollege" list="collegeList" placeholder="Search or type your college">
          <datalist id="collegeList"></datalist>
        </label>
        <label>Department
          <input id="pfDept" list="deptList" placeholder="Search or type your department">
          <datalist id="deptList"></datalist>
        </label>
        <label>Current Semester
          <input id="pfSem" list="semList" placeholder="1 - 8">
          <datalist id="semList"></datalist>
        </label>
        <button class="btn full" type="submit">Save Profile</button>
      </form>
      <div id="profileMessage" class="message"></div>
    </div>
  </div>

  <!-- FEEDBACK MODAL -->
  <div id="feedbackModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="closeFeedbackModal">&times;</button>
      <h2>Send Feedback</h2>
      <p class="hint">Tell us what you like or what we can improve. Your feedback goes to the admins.</p>
      <form id="feedbackForm">
        <label>Your feedback
          <textarea id="feedbackMessage" rows="5" required placeholder="Write your feedback here..."></textarea>
        </label>
        <button class="btn full" type="submit">Submit Feedback</button>
      </form>
      <div id="feedbackResult" class="message"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <footer class="footer">
    <p>Developed by <strong>Sudhasun</strong></p>
</footer>

</body>
</html>
