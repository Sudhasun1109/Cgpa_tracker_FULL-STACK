<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CGPA Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="dashboard.html">🎓 CGPA Tracker</a>
      <div class="nav-right">
        <img id="navAvatar" class="nav-avatar hidden" alt="Me">
        <a href="profile.html" class="btn btn-outline" data-no-rl>Profile</a>
        <button id="logoutBtn" class="btn btn-outline">Logout</button>
      </div>
    </div>
  </header>
  <main class="container dashboard">
    <section class="welcome">
      <div>
        <span class="badge">Dashboard</span>
        <h1 id="welcome">Welcome!</h1>
        <p id="profileText"></p>
      </div>
      <button id="addSemesterBtn" class="btn" data-no-rl>+ Add Semester</button>
    </section>

    <section class="stats">
      <div class="stat-card"><small>Current CGPA</small><strong id="cgpa">0.00</strong></div>
      <div class="stat-card"><small>Total Credits</small><strong id="credits">0</strong></div>
      <div class="stat-card"><small>Semesters</small><strong id="semesterCount">0</strong></div>
      <div class="stat-card"><small>Best GPA</small><strong id="bestGpa">0.00</strong></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>CGPA Progress</h2><span id="status"></span></div>
      <div id="chart" class="chart"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Your Semesters</h2></div>
      <div id="semesters" class="semester-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Mark Sheets</h2>
        <button id="addMarksheetBtn" class="btn" data-no-rl>+ Add Mark Sheet</button>
      </div>
      <div id="marksheets" class="marksheet-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Send Feedback</h2></div>
      <p class="hint">Have a suggestion or found a bug? Let us know — the admin team reviews all feedback.</p>
      <form id="feedbackForm" class="feedback-form">
        <label>Your feedback
          <textarea id="feedbackMessage" rows="3" maxlength="2000" required placeholder="Type your feedback..."></textarea>
        </label>
        <label>Rating (optional)
          <select id="feedbackRating">
            <option value="">No rating</option>
            <option value="5">★★★★★ (5)</option>
            <option value="4">★★★★ (4)</option>
            <option value="3">★★★ (3)</option>
            <option value="2">★★ (2)</option>
            <option value="1">★ (1)</option>
          </select>
        </label>
        <button class="btn" type="submit">Submit Feedback</button>
      </form>
      <div id="feedbackMessageBox" class="message"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="closeModal">×</button>
      <h2>Add Semester</h2>
      <form id="semesterForm">
        <label>Semester Number
          <input id="semesterNumber" type="number" min="1" max="12" required>
        </label>
        <label>Semester Name
          <input id="semesterName" placeholder="Semester 1" required>
        </label>
        <button class="btn full" type="submit">Create Semester</button>
      </form>
      <div id="modalMessage" class="message"></div>
    </div>
  </div>

  <div id="marksheetModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="closeMarksheetModal">×</button>
      <h2>Add Mark Sheet</h2>
      <form id="marksheetForm">
        <label>Title
          <input id="marksheetTitle" placeholder="Semester 2 Grade Sheet" required>
        </label>
        <label>Semester Number (optional)
          <input id="marksheetSemester" type="number" min="1" max="12" placeholder="2">
        </label>
        <label>Mark Sheet Image
          <input id="marksheetFile" type="file" accept="image/*" required>
        </label>
        <div id="marksheetPreview" class="ms-preview"></div>
        <button class="btn full" type="submit">Upload Mark Sheet</button>
      </form>
      <div id="marksheetMessage" class="message"></div>
    </div>
  </div>

  <div id="viewerModal" class="modal hidden">
    <div class="viewer-card">
      <button class="close" id="closeViewer">×</button>
      <img id="viewerImage" alt="Mark sheet">
    </div>
  </div>

  <script src="js/ratelimit.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
   <footer class="footer">
    <p>Developed by <strong>Sudhasun</strong></p>
</footer>
</body>
</html>
