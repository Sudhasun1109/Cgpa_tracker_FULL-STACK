<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Semester subjects and grades.">
  <meta name="author" content="CGPA Tracker">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://cgpa-tracker-frontend.onrender.com/semester.html">
  <link rel="icon" href="icons/icon-192.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CGPA Tracker">
  <meta property="og:title" content="Semester – CGPA Tracker">
  <meta property="og:description" content="Semester subjects and grades.">
  <meta property="og:url" content="https://cgpa-tracker-frontend.onrender.com/semester.html">
  <meta property="og:image" content="https://cgpa-tracker-frontend.onrender.com/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Semester – CGPA Tracker">
  <meta name="twitter:description" content="Semester subjects and grades.">
  <meta name="twitter:image" content="https://cgpa-tracker-frontend.onrender.com/icons/og-image.png">
  <title>Semester – CGPA Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CGPA">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="dashboard.html">🎓 CGPA Tracker</a>
      <button id="logoutBtn" class="btn btn-outline">Logout</button>
    </div>
  </header>

  <main class="container dashboard">
    <section class="welcome">
      <div>
        <a href="dashboard.html" class="back">← Dashboard</a>
        <h1 id="semesterTitle">Semester</h1>
        <p>Add your subjects, credits and grades.</p>
      </div>
      <div class="semester-score">
        <small>Semester GPA</small>
        <strong id="gpa">0.00</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Subjects</h2>
        <button id="addSubjectBtn" class="btn">+ Add Subject</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Subject</th><th>Code</th><th>Credits</th><th>Grade</th><th>Point</th><th></th></tr></thead>
          <tbody id="subjects"></tbody>
        </table>
      </div>
      <div id="empty" class="empty">No subjects added yet.</div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="closeModal">×</button>
      <h2>Add Subject</h2>
      <form id="subjectForm">
        <label>Subject Name<input id="subjectName" required></label>
        <label>Subject Code<input id="subjectCode"></label>
        <label>Credits<input id="credits" type="number" min="0" max="10" step="0.5" required></label>
        <label>Grade
          <select id="grade" required>
            <option value="">Select grade</option>
            <option>O</option><option>A+</option><option>A</option><option>B+</option>
            <option>B</option><option>C</option><option>P</option><option>U</option>
          </select>
        </label>
        <button class="btn full" type="submit">Add Subject</button>
      </form>
      <div id="modalMessage" class="message"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/semester.js"></script>
  <footer class="footer">
    <p>Developed by <strong>Sudhasun</strong></p>
</footer>

</body>
</html>
